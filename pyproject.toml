[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "local-agent-radio"
version = "0.1.0.dev0"
description = "A private, localhost-first coordination service for people and AI agents."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Local Agent Radio contributors" }]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
